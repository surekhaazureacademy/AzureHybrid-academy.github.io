<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Surekha Azure Hybrid Academy</title>
<!-- Swiper CSS for carousel -->
<link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css"/>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #000; /* Dark background for a tech look */
    color: #fff;
    margin: 0;
    padding: 0;
  }
  header {
    text-align: center;
    padding: 20px;
  }
  /* Logo styling */
  .logo {
    width: 150px;
    max-width: 100%;
  }
  /* Carousel container styling */
  .swiper {
    width: 100%;
    padding: 40px 0;
  }
  /* Video slide styling */
  .swiper-slide {
    display: flex;
    justify-content: center;
    align-items: center;
  }
  /* Video iframe styling */
  iframe {
    width: 100%;
    max-width: 1020px;
    height: 315px;
  }
</style>
</head>
<body>

<header>
  <img src="https://yt3.googleusercontent.com/CF1dsfpC0cgMCOaT2gblcxCde-BNSGoRbbmAf4CH4v3NCYGyNnF1LI13mosSLQzQ71jLHUOh2A=w1707-fcrop64=1,00005a57ffffa5a8-k-c0xffffffff-no-nd-rj" alt="Surekha Azure Hybrid Academy Logo" class="logo" />
</header>

<!-- Carousel container -->
<div class="swiper mySwiper">
  <div class="swiper-wrapper">
    <!-- Video slides -->
    <div class="swiper-slide">
      <iframe src="https://www.youtube.com/embed/4B4wMSdkhZI" frameborder="0" allowfullscreen></iframe>
    </div>
    <div class="swiper-slide">
      <iframe src="https://www.youtube.com/embed/qDJF-J9K3AA" frameborder="0" allowfullscreen></iframe>
    </div>
    <div class="swiper-slide">
      <iframe src="https://www.youtube.com/embed/P137U4H6Nno" frameborder="0" allowfullscreen></iframe>
    </div>
    <!-- Add more slides as needed -->
  </div>
  <!-- Optional navigation buttons -->
  <div class="swiper-button-prev"></div>
  <div class="swiper-button-next"></div>
</div>

<!-- Swiper JS -->
<script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
<script>
  var swiper = new Swiper('.mySwiper', {
    slidesPerView: 1,
    spaceBetween: 30,
    loop: true,
    navigation: {
      nextEl: '.swiper-button-next',
      prevEl: '.swiper-button-prev',
    },
    autoplay: {
      delay: 4000,
    },
  });
</script>

</body>
</html>
